name: Build All Platforms (Android, Mac, Windows, Web)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. Android APK Build (Generates installable .apk in Cloud)
  # -------------------------------------------------------------
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web App & Sync to Android
        run: npm run build:mobile:android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK with Version
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/BhashaSetu-v1.0.0-debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhashaSetu-Android-APK
          path: android/app/build/outputs/apk/debug/BhashaSetu-v1.0.0-debug.apk
          retention-days: 30

  # -------------------------------------------------------------
  # 2. macOS Desktop Build (Generates .dmg & .zip for Apple Silicon & Intel)
  # -------------------------------------------------------------
  build-macos:
    name: 🍏 Build macOS Desktop (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build macOS Application (.dmg and .zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:desktop:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BhashaSetu-macOS-Desktop
          path: |
            release/*.dmg
            release/*-mac.zip
          retention-days: 30

  # -------------------------------------------------------------
  # 3. Windows Desktop Build (Generates .exe and Portable Zip)
  # -------------------------------------------------------------
  build-windows:
    name: 🪟 Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Windows Application (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:desktop:win

      - name: Create Windows Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path release/win-unpacked/* -DestinationPath release/BhashaSetu-Windows-x64-Portable.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BhashaSetu-Windows-Desktop
          path: |
            release/*.exe
            release/*.zip
          retention-days: 30

  # -------------------------------------------------------------
  # 4. Web & PWA Bundle
  # -------------------------------------------------------------
  build-web:
    name: 🌐 Build Web & PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Client & Server
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhashaSetu-Web-PWA
          path: dist/
          retention-days: 30
